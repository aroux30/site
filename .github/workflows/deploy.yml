name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production
      skip_backup:
        description: "Skip database backup before deploy"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment
        run: |
          echo "Deploying to: ${{ github.event.inputs.environment }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Skip backup: ${{ github.event.inputs.skip_backup }}"

      - name: Set deployment variables
        id: vars
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "server_host=${{ secrets.PROD_SERVER_HOST }}" >> "$GITHUB_OUTPUT"
            echo "server_user=${{ secrets.PROD_SERVER_USER }}" >> "$GITHUB_OUTPUT"
            echo "deploy_path=${{ secrets.PROD_DEPLOY_PATH }}" >> "$GITHUB_OUTPUT"
          else
            echo "server_host=${{ secrets.STAGING_SERVER_HOST }}" >> "$GITHUB_OUTPUT"
            echo "server_user=${{ secrets.STAGING_SERVER_USER }}" >> "$GITHUB_OUTPUT"
            echo "deploy_path=${{ secrets.STAGING_DEPLOY_PATH }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.vars.outputs.server_host }} >> ~/.ssh/known_hosts

      - name: Pre-deploy backup
        if: ${{ github.event.inputs.skip_backup != 'true' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ steps.vars.outputs.server_user }}@${{ steps.vars.outputs.server_host }} \
            "cd ${{ steps.vars.outputs.deploy_path }} && bash scripts/backup.sh"

      - name: Pull latest code
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ steps.vars.outputs.server_user }}@${{ steps.vars.outputs.server_host }} \
            "cd ${{ steps.vars.outputs.deploy_path }} && git fetch origin && git checkout ${{ github.sha }}"

      - name: Build and restart containers
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ steps.vars.outputs.server_user }}@${{ steps.vars.outputs.server_host }} \
            "cd ${{ steps.vars.outputs.deploy_path }} && bash scripts/deploy.sh ${{ github.event.inputs.environment }}"

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ steps.vars.outputs.server_user }}@${{ steps.vars.outputs.server_host }} \
            "cd ${{ steps.vars.outputs.deploy_path }} && docker compose exec -T backend python manage.py migrate"

      - name: Health check
        run: |
          MAX_RETRIES=10
          RETRY_INTERVAL=5
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            HEALTH_URL="${{ secrets.PROD_HEALTH_URL }}"
          else
            HEALTH_URL="${{ secrets.STAGING_HEALTH_URL }}"
          fi

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_CODE - retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          echo "Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed - initiating rollback"
          ssh -i ~/.ssh/deploy_key \
            ${{ steps.vars.outputs.server_user }}@${{ steps.vars.outputs.server_host }} \
            "cd ${{ steps.vars.outputs.deploy_path }} && git checkout HEAD~1 && docker compose up -d --build"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment to ${{ github.event.inputs.environment }} succeeded."
          else
            echo "Deployment to ${{ github.event.inputs.environment }} failed."
          fi
