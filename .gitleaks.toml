# Gitleaks configuration for Iranian E-Commerce Platform
title = "Security Secret Detection Policy"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for non-sensitive public fixtures"
paths = [
  '''^\.env\.example$''',
  '''^tests/.*''',
  '''^frontend/\.next/.*''',
  '''^frontend/node_modules/.*''',
]
regexes = [
  '''09123456789''',
  '''admin@site\.com''',
]
