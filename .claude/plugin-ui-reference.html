<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Plugin UI reference (exact)</title>
<style>
  html,body { margin:0; padding:0; background:#fff; font-family: Vazirmatn, Inter, "Segoe UI", sans-serif; }
  /* The plugin's exact CSS block (script.js:141-191), C.primary/button = #007ACC */
  :root {
    --n8n-bg: #EEEEEE;
    --n8n-fg: #101010;
    --n8n-accent: #007ACC;
    --n8n-surface: #FFFFFF;
    --n8n-surface-alt: #F8F8F8;
    --n8n-border: rgba(0,0,0,0.08);
    --n8n-muted: #666666;
    --n8n-shadow: 0 12px 48px rgba(0,0,0,0.15);
    --n8n-shadow-sm: 0 4px 16px rgba(0,0,0,0.08);
    --n8n-radius: 20px;
  }
  #n8n-win { background: var(--n8n-bg) !important; box-shadow: var(--n8n-shadow) !important; border-radius: var(--n8n-radius) !important; border: 1px solid var(--n8n-border) !important; }
  .n8n-surface { background: var(--n8n-surface) !important; border: 1px solid var(--n8n-border) !important; box-shadow: var(--n8n-shadow-sm) !important; color: var(--n8n-fg) !important; }
  .n8n-text { color: var(--n8n-fg) !important; }
  .n8n-muted { color: var(--n8n-muted) !important; }
  .n8n-input { background: var(--n8n-surface) !important; color: var(--n8n-fg) !important; border: 1px solid var(--n8n-border) !important; }
  .n8n-input:focus { border-color: var(--n8n-accent) !important; }
  .n8n-bubble-me { background: var(--n8n-accent) !important; color: #fff !important; border-radius: 18px 18px 4px 18px !important; box-shadow: 0 4px 12px rgba(0,122,204,0.3) !important; }
  .n8n-bubble-me-fa { border-radius: 18px 18px 18px 4px !important; }
  .n8n-bubble-other { background: var(--n8n-surface) !important; color: var(--n8n-fg) !important; border: 1px solid var(--n8n-border) !important; border-radius: 18px 18px 18px 4px !important; box-shadow: var(--n8n-shadow-sm) !important; }
  .n8n-bubble-other-fa { border-radius: 18px 18px 4px 18px !important; }
  @keyframes n8nWiggle { 0% { transform: rotate(0deg); } 25% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } 75% { transform: rotate(-8deg); } 100% { transform: rotate(0deg); } }
  .ntab:hover svg, #n8n-min:hover svg, #n8n-toggle:hover svg { animation: n8nWiggle 0.4s ease-in-out infinite; }
  #cm { display: flex !important; flex-direction: column !important; }
  .n8n-msg-me { margin-left: auto !important; margin-right: 0 !important; }
  .n8n-msg-other { margin-right: auto !important; margin-left: 0 !important; }
  #n8n-badge { position:absolute; top:-2px; right:-2px; width:14px; height:14px; background:#ef4444; border-radius:50%; border:2px solid #fff; display:none; animation: n8nPulse 1.5s ease-in-out infinite; z-index:1000001; }
  @keyframes n8nPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.3); } }
  @keyframes n8nHalo { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.6); opacity: 0; } }
  .n8n-halo { position:absolute; inset:0; border-radius:50%; background:#007ACC; opacity:0; pointer-events:none; }
  .n8n-halo-1 { animation: n8nHalo 2s infinite ease-out; }
  .n8n-halo-2 { animation: n8nHalo 2s infinite ease-out 1s; }
  @keyframes n8nBreath { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }
  #n8n-proactive-wrap { animation: n8nBreath 2.5s ease-in-out infinite; }
  #n8n-pro-ring { animation: n8nBreath 2.5s ease-in-out infinite; }
</style>
</head>
<body>
<!-- Exact widget markup (script.js:192-234), btnBottom=20 btnSide=20 W=394 H=650, isFa, side=right -->
<div id="n8n-w" style="direction:rtl;position:fixed;z-index:999999;font-family:Vazirmatn,Inter,Segoe UI,sans-serif;">

  <!-- Toggle Button Wrapper -->
  <div id="n8n-toggle-wrap" style="position:fixed;bottom:20px;right:20px;width:56px;height:56px;z-index:999999;">
    <button id="n8n-toggle" style="width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#007ACC;color:#fff;box-shadow:0 8px 25px rgba(95,70,248,0.4);transition:transform 0.3s,opacity 0.3s;overflow:hidden;">
      <span id="ico-o" style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg></span>
    </button>
  </div>

  <!-- Window -->
  <div id="n8n-win" style="display:flex;position:fixed;bottom:90px;right:20px;width:394px;height:650px;border-radius:var(--n8n-radius);background:var(--n8n-bg);box-shadow:var(--n8n-shadow);border:1px solid var(--n8n-border);overflow:hidden;flex-direction:column;z-index:999998;">
    <div id="n8n-hdr" style="background:#007ACC;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;color:#fff;flex-shrink:0;">
      <h3 id="n8n-title" style="font-weight:700;font-size:15px;margin:0;">خوش‌آمدید</h3>
      <div style="display:flex;align-items:center;gap:18px;">
        <button id="n8n-user-handoff" style="display:none;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 20px;border-radius:var(--n8n-radius);cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;transition:all 0.2s;">انتقال به انسان</button>
        <button id="n8n-x" style="background:rgba(255,255,255,0.15);border:none;color:#fff;padding:4px 8px;border-radius:8px;cursor:pointer;font-size:16px;">✕</button>
      </div>
    </div>
    <div id="n8n-body" style="flex:1;overflow-y:auto;background:var(--n8n-bg);">
      <!-- welcome view (script.js:238-255) -->
      <div style="animation:n8nUp .3s ease;">
        <div style="background:#007ACC;padding:28px 22px 45px;text-align:center;color:#fff;border-radius:0 0 28px 28px;">
          <h2 style="font-size:20px;font-weight:700;margin:0 0 4px;">خوش‌آمدید</h2>
          <p style="font-size:12px;opacity:0.85;margin:0;"></p>
        </div>
        <div style="margin:-22px 18px 0;position:relative;z-index:2;">
          <div style="background:var(--n8n-surface);border-radius:16px;box-shadow:var(--n8n-shadow-sm);display:flex;align-items:center;padding:10px 14px;border:1px solid #f0f0f0;">
            <span style="margin-left:8px;flex-shrink:0;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#999"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></span>
            <input type="text" placeholder="جستجو در سوالات..." style="border:none;background:transparent;outline:none;font-size:12px;width:100%;color:var(--n8n-fg);font-family:inherit;">
          </div>
        </div>
        <div style="padding:18px;">
          <div style="background:var(--n8n-surface);border-radius:16px;padding:18px;text-align:center;box-shadow:var(--n8n-shadow-sm);border:1px solid var(--n8n-border);">
            <p style="font-size:11px;color:var(--n8n-muted);margin:0 0 12px;">ما اینجا هستیم تا به شما کمک کنیم</p>
            <button id="btn-start" style="width:100%;background:#007ACC;color:#fff;font-weight:700;font-size:13px;padding:12px;border:none;border-radius:var(--n8n-radius);cursor:pointer;box-shadow:0 8px 20px #007ACC40;font-family:inherit;">ارسال پیام به ما</button>
          </div>
        </div>
      </div>
    </div>
    <div id="n8n-tabs" style="display:flex;align-items:center;height:58px;flex-shrink:0;background:var(--n8n-surface); opacity:0.98;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--n8n-border);">
      <button data-v="welcome" class="ntab" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border:none;background:none;cursor:pointer;color:#007ACC;font-size:9px;font-family:inherit;"><div class="tw" style="padding:6px;border-radius:10px;background:#edf0f5;"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></div><span>خوش‌آمدید</span></button>
      <button data-v="conversations" class="ntab" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border:none;background:none;cursor:pointer;color:var(--n8n-muted);font-size:9px;font-family:inherit;"><div class="tw" style="padding:6px;border-radius:10px;"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg></div><span>گفتگوها</span></button>
      <button data-v="faqs" class="ntab" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border:none;background:none;cursor:pointer;color:var(--n8n-muted);font-size:9px;font-family:inherit;"><div class="tw" style="padding:6px;border-radius:10px;"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><span>سوالات متداول</span></button>
      <button data-v="news" class="ntab" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border:none;background:none;cursor:pointer;color:var(--n8n-muted);font-size:9px;font-family:inherit;"><div class="tw" style="padding:6px;border-radius:10px;"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg></div><span>اخبار</span></button>
      <button id="n8n-min" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border:none;background:none;cursor:pointer;color:#ccc;font-size:9px;font-family:inherit;">
        <div style="padding:6px;"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg></div><span>بستن</span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
