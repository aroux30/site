worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ──────────────────────────────────────────
    # Logging
    # ──────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=16k flush=2m;
    error_log /var/log/nginx/error.log warn;

    # ──────────────────────────────────────────
    # Performance
    # ──────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 16k;

    # ──────────────────────────────────────────
    # Anti-Bot & Scanner Filter Map
    # ──────────────────────────────────────────
    map $http_user_agent $bad_bot {
        default 0;
        ~*(sqlmap|nikto|wpscan|masscan|zgrab|nmap|acunetix) 1;
        ~*(dirbuster|gobuster|ffuf|hydra|burp|netsparker) 1;
        ~*(havij|paros|webscarab|pangolin|nuclei) 1;
        ~*(SemrushBot|AhrefsBot|MJ12bot|DotBot) 1;
    }

    # ──────────────────────────────────────────
    # Rate Limiting Zones
    # ──────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_req_status 429;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ──────────────────────────────────────────
    # SSL Settings
    # ──────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ──────────────────────────────────────────
    # Gzip Compression
    # ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ──────────────────────────────────────────
    # Brotli Compression (if module available)
    # ──────────────────────────────────────────
    # Uncomment if nginx is compiled with brotli module
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/javascript application/json
    #              application/javascript application/xml image/svg+xml;

    # ──────────────────────────────────────────
    # Proxy Cache
    # ──────────────────────────────────────────
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                     max_size=100m inactive=10m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m
                     max_size=500m inactive=60m use_temp_path=off;

    # ──────────────────────────────────────────
    # Dynamic upstream resolution (TASK P12-01)
    # Docker's embedded DNS re-resolves these names every 10s so a
    # recreated backend/frontend container never leaves nginx proxying to
    # a stale container IP (502 on all routes).
    # ──────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ──────────────────────────────────────────
    # HTTP -> HTTPS Redirect
    # ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────
    # HTTPS Server
    # ──────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ${DOMAIN};

        # ──────────────────────────────────────
        # SSL Certificates (Let's Encrypt)
        # ──────────────────────────────────────
        ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

        # ──────────────────────────────────────
        # Security Headers
        # ──────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self';" always;

        # Upstream variables (resolved per-request via the resolver above)
        set $backend_up backend;
        set $frontend_up frontend;

        # Connection limits
        limit_conn conn_limit 50;

        # Anti-Bot & Scanner Defense (Light WAF)
        if ($bad_bot = 1) {
            return 403 '{"error":"forbidden","message":"Access denied: automated security scanner blocked"}';
        }

        # Block sensitive and hidden files
        location ~* /\.(git|env|aws|ssh|svn|htaccess) {
            deny all;
            return 404;
        }

        # Block legacy script probing
        location ~* \.(php|asp|aspx|jsp|cgi)$ {
            deny all;
            return 404;
        }

        # ──────────────────────────────────────
        # Health Check Endpoint
        # ──────────────────────────────────────
        location /health {
            proxy_pass http://$backend_up/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ──────────────────────────────────────
        # Auth Routes -> Backend (Strict Rate Limiting)
        # ──────────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://$backend_up/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ──────────────────────────────────────
        # API Routes -> Backend (rate limited)
        # ──────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://$backend_up/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ──────────────────────────────────────
        # Auth routes - stricter rate limiting
        # ──────────────────────────────────────
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://$backend_up/api/v1/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /api/v1/auth/register {
            limit_req zone=login_limit burst=2 nodelay;

            proxy_pass http://$backend_up/api/v1/auth/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ──────────────────────────────────────
        # OpenAPI Documentation -> Backend
        # ──────────────────────────────────────
        location /docs {
            # Restrict docs access in production if needed
            # allow 10.0.0.0/8;
            # deny all;

            proxy_pass http://$backend_up/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass http://$backend_up/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://$backend_up/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ──────────────────────────────────────
        # Static Assets - Aggressive Caching
        # ──────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://$frontend_up/_next/static/;
            proxy_cache static_cache;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;

            access_log off;
        }

        location /static/ {
            proxy_pass http://$frontend_up/static/;
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header Cache-Control "public, max-age=2592000";
            add_header X-Cache-Status $upstream_cache_status;

            access_log off;
        }

        # ──────────────────────────────────────
        # Favicon and robots
        # ──────────────────────────────────────
        location = /favicon.ico {
            proxy_pass http://$frontend_up/favicon.ico;
            access_log off;
            log_not_found off;
            expires 30d;
        }

        location = /robots.txt {
            proxy_pass http://$frontend_up/robots.txt;
            access_log off;
            log_not_found off;
        }

        # ──────────────────────────────────────
        # Admin routes -> Backend
        # ──────────────────────────────────────
        location /admin/ {
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://$backend_up/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ──────────────────────────────────────
        # Frontend (Next.js) - Catch All
        # ──────────────────────────────────────
        location / {
            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://$frontend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ──────────────────────────────────────
        # Block common exploits
        # ──────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|git|svn|htaccess|htpasswd|ini|log|sh|sql|bak|conf|dist|fla|psd|swp)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ──────────────────────────────────────
        # Error Pages
        # ──────────────────────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
