# Distributed Locust Cluster for 10,000 Concurrent User Stress Testing
#
# Usage:
#   docker compose -f load_tests/docker-compose.locust.yml up --scale locust-worker=8
#
# Web Dashboard: http://localhost:8089

version: "3.9"

services:
  locust-master:
    image: locustio/locust:2.31.0
    container_name: locust-master
    ports:
      - "8089:8089"
    volumes:
      - ..:/mnt/locust
    command: -f /mnt/locust/load_tests/locustfile.py --master -H https://site.arouxpingg.com
    environment:
      - TARGET_HOST=https://site.arouxpingg.com
      - LOAD_TEST_BYPASS_TOKEN=stress-test-authorized-2026
    networks:
      - locust-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  locust-worker:
    image: locustio/locust:2.31.0
    volumes:
      - ..:/mnt/locust
    command: -f /mnt/locust/load_tests/locustfile.py --worker --master-host locust-master
    environment:
      - TARGET_HOST=https://site.arouxpingg.com
      - LOAD_TEST_BYPASS_TOKEN=stress-test-authorized-2026
    networks:
      - locust-net
    depends_on:
      - locust-master
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
      replicas: 4

networks:
  locust-net:
    driver: bridge
