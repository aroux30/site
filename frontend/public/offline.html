<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10b981">
  <title>اتصال اینترنت قطع شده | فروشگاه آنلاین</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Vazirmatn, Tahoma, Arial, sans-serif;
      background-color: #f9fafb;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      direction: rtl;
      padding: 1rem;
    }

    .container {
      text-align: center;
      max-width: 28rem;
      width: 100%;
      padding: 2.5rem 2rem;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }

    .icon {
      width: 5rem;
      height: 5rem;
      margin: 0 auto 1.5rem;
      color: #10b981;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: #064e3b;
    }

    p {
      font-size: 0.9375rem;
      color: #6b7280;
      margin-bottom: 2rem;
      line-height: 1.75;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 2rem;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .retry-btn:hover { background-color: #059669; }
    .retry-btn:focus-visible {
      outline: 2px solid #10b981;
      outline-offset: 2px;
    }
    .retry-btn:active { transform: scale(0.98); }

    @media (prefers-color-scheme: dark) {
      body { background-color: #0f1512; color: #e5e7eb; }
      .container { background: #1a2420; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3); }
      h1 { color: #6ee7b7; }
      p { color: #9ca3af; }
    }

    @media (prefers-reduced-motion: reduce) {
      .retry-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
    </svg>
    <h1>اتصال اینترنت قطع شده</h1>
    <p>
      لطفاً اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182" />
      </svg>
      تلاش مجدد
    </button>
  </div>
</body>
</html>
