# Gitleaks configuration for Iranian E-Commerce Platform
title = "Security Secret Detection Policy"

[extend]
useDefault = true

# Non-sensitive public example values
[[allowlists]]
description = "Non-sensitive public example values"
paths = [
  '''^\.env\.example$''',
  '''^frontend/\.next/.*''',
  '''^frontend/node_modules/.*''',
]
regexes = [
  '''09123456789''',
  '''admin@site\.com''',
]

# ── Documented, narrowly-scoped allowlists (no blanket path exclusions) ──

# Historical test fixture: commit 194ce17 briefly contained a CI
# service-container-style Postgres password inside test_payments.py; the
# value was removed from the tree and never guarded real infrastructure.
# Fingerprint-pinned so only that exact historical finding is ignored.
[[allowlists]]
description = "Historical CI test-DB fixture password (removed from tree; never a real credential)"
commits = ["194ce1765ed00b2065bdb94769e45ae5a0cde5a7"]
paths = ['''^backend/tests/unit/test_payments\.py$''']

# P1-07: real credentials were committed in scripts/ssh_deploy.py and are
# flagged by this scanner. The file was rewritten on 2026-09-11 to source
# every secret from the operator environment; the **historical commits**
# still contain the pre-rotation values, which are pinned here by path+rule
# until the matching server-side credential rotation is completed and
# verified (see docs/ecommerce-fix-roadmap.md, TASK P1-07). Remove this
# allowlist after rotation is confirmed.
[[allowlists]]
description = "Pre-rotation credentials in ssh_deploy.py history; rotation pending (TASK P1-07)"
rules = ["generic-api-key", "generic-password", "postgresql-password", "aws-access-token"]
paths = ['''^scripts/ssh_deploy\.py$''']
