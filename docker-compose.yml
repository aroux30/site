# Development / base stack.
#
# Service names match what the docs and .env.example reference —
# `docker compose logs backend`, `docker compose exec postgres` — so an
# operator following a runbook lands on the right container.
#
# Production differences live in docker-compose.prod.yml (use together:
# `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`):
# that file closes the host ports, enables TLS-only nginx, turns on ES
# security, and adds resource limits.
#
# Ports are published on the host for development convenience. In production
# they are deliberately NOT published — only nginx is reachable.

name: ecommerce

services:
  # ── Data stores ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Persian collation for correct sorting of product and customer names.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # loopback only: never expose the DB publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app]

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    # requirepass via command (not a config file) so the password comes from
    # the environment and cannot be committed by accident.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: ecommerce-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Security is OFF in the dev stack so a fresh clone works without
      # certificates. docker-compose.prod.yml turns it ON; the application
      # reads ELASTICSEARCH_PASSWORD when xpack.security is enabled.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [app]

  minio:
    image: minio/minio:latest
    container_name: ecommerce-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"   # console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app]

  # ── Application ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Inside the compose network the service names are the hostnames. These
      # override whatever the .env file says, so a developer's localhost URL
      # cannot leak into the container and break it silently.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Media is written to the uploads volume below, not to object storage.
      # MINIO_ENDPOINT is deliberately unset: nothing in the write path reads
      # it, and leaving it pointed at a service the app does not use made the
      # readiness probe report an outage that broke nothing (see main.py
      # _check_storage). Restore it only alongside an actual S3 migration.
    volumes:
      - media_data:/app/media
      - uploads_data:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [app]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # The worker must not run migrations: several replicas starting at once
      # would race for the alembic version lock. The backend owns the schema.
      RUN_MIGRATIONS: "false"
    volumes:
      - media_data:/app/media
      - uploads_data:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    command: ["bash", "scripts/worker.sh"]
    networks: [app]

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-beat
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      RUN_MIGRATIONS: "false"
      MODE: beat
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    command: ["bash", "scripts/worker.sh"]
    networks: [app]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-E-Commerce Platform}
    container_name: ecommerce-frontend
    restart: unless-stopped
    environment:
      # SSR calls the backend by service name; the browser calls the relative
      # /api/v1 through nginx. Both must be set — a server component with a
      # relative URL renders an empty page.
      API_INTERNAL_URL: http://backend:8000/api/v1
      BACKEND_ORIGIN: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend: { condition: service_started }
    ports:
      - "127.0.0.1:3000:3000"
    networks: [app]

  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_started }
    ports:
      - "80:80"
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:
  media_data:
  uploads_data:
  nginx_cache:
